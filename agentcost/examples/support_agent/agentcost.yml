name: support-agent

agent:
  run: python -m support_agent.run --input {fixture} --output {output}
  timeout_s: 300
  concurrency: 8

fixtures: fixtures/*.json
samples: 3

quality:
  assert: fixtures/asserts.py
  max_quality_drop: 5%

budgets:
  max_regression: 15%
  cost_per_run_p50: 0.18

spend_cap_usd: 15
pricing: builtin
