name: agentcost

on:
  push:
    branches: [main]
    paths:
      - 'agentcost/**'
      - '.github/workflows/agentcost.yml'
  pull_request:
    paths:
      - 'agentcost/**'
      - '.github/workflows/agentcost.yml'

jobs:
  test:
    name: agentcost Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]  # oldest supported and newest
    defaults:
      run:
        working-directory: agentcost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agentcost/pyproject.toml

      - name: Install dependencies
        run: |
          python -m venv .venv
          make dev

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Seeded-regression acceptance test against the offline mock model; no API keys needed.
      - name: Benchmark
        run: make test-benchmark

  package:
    name: agentcost Build & Check Package
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: agentcost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentcost/pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet build twine
          .venv/bin/python -m build
          .venv/bin/twine check dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --quiet dist/ezop_agentcost-*.whl
          /tmp/wheel-env/bin/ezop-agentcost --version
          /tmp/wheel-env/bin/ezop-agentcost init --dir /tmp/init-check
          test -f /tmp/init-check/agentcost.yml

      - uses: actions/upload-artifact@v4
        with:
          name: agentcost-dist
          path: agentcost/dist/
          retention-days: 7
